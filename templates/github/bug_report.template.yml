name: Bug Report
description: Create a report to help reproduce and fix a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue. Please provide clear details to reproduce the bug.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Run command '...'
        2. Set config '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Operating system, runtime version, and package versions.
    validations:
      required: false
