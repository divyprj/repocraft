name: Feature Request
description: Suggest an idea or enhancement for this project
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your ideas for improving this software.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or limitation?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features considered.
    validations:
      required: false
