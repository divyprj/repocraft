<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" role="img" aria-label="Before and After RepoCraft Comparison">
  <defs>
    <pattern id="draftGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e4ded2" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Warm ivory editorial canvas -->
  <rect width="1120" height="390" rx="12" fill="#f5f2eb" stroke="#d4cec0" stroke-width="1.5"/>
  <rect width="1120" height="390" rx="12" fill="url(#draftGrid)" opacity="0.65"/>

  <!-- Header rule -->
  <text x="36" y="40" fill="#141619" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" letter-spacing="0.1em">01 / WHY REPOCRAFT</text>
  <text x="1084" y="40" text-anchor="end" fill="#6b655a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">FACTUAL ENGINEERING VS. AI BOILERPLATE</text>
  <line x1="36" y1="54" x2="1084" y2="54" stroke="#141619" stroke-width="1.2"/>

  <!-- Left Panel: Raw AI Agent -->
  <g transform="translate(36, 74)">
    <rect width="510" height="284" rx="8" fill="#fbf9f4" stroke="#d4cec0" stroke-width="1.2"/>
    <rect width="510" height="5" rx="2.5" fill="#9a3412"/>
    <text x="22" y="34" fill="#9a3412" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.06em">WITHOUT REPOCRAFT (UNGUIDED AGENT)</text>

    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#2b2d31">
      <line x1="22" y1="48" x2="488" y2="48" stroke="#e4ded2"/>
      <text x="22" y="78" fill="#9a3412" font-weight="700">01</text>
      <text x="50" y="78">Hallucinates API endpoints, env vars, and CLI flags</text>

      <line x1="22" y1="96" x2="488" y2="96" stroke="#ece7dc"/>
      <text x="22" y="126" fill="#9a3412" font-weight="700">02</text>
      <text x="50" y="126">Writes hype copy ("cutting-edge revolutionary solution")</text>

      <line x1="22" y1="144" x2="488" y2="144" stroke="#ece7dc"/>
      <text x="22" y="174" fill="#9a3412" font-weight="700">03</text>
      <text x="50" y="174">Generates empty placeholder docs and broken links</text>

      <line x1="22" y1="192" x2="488" y2="192" stroke="#ece7dc"/>
      <text x="22" y="222" fill="#9a3412" font-weight="700">04</text>
      <text x="50" y="222">Invents licenses, fake credits, or alters app logic</text>
    </g>

    <rect x="22" y="242" width="466" height="26" rx="4" fill="#f3e8e2"/>
    <text x="34" y="259" fill="#9a3412" font-family="ui-monospace, monospace" font-size="11">OUTCOME: Maintainers spend hours reverting inaccurate PRs</text>
  </g>

  <!-- Right Panel: With RepoCraft -->
  <g transform="translate(574, 74)">
    <rect width="510" height="284" rx="8" fill="#141619" stroke="#141619" stroke-width="1.2"/>
    <rect width="510" height="5" rx="2.5" fill="#c84b31"/>
    <text x="22" y="34" fill="#e87a64" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.06em">WITH REPOCRAFT SKILL (CODE-VERIFIED)</text>

    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f5f2eb">
      <line x1="22" y1="48" x2="488" y2="48" stroke="#2a2e35"/>
      <text x="22" y="78" fill="#c84b31" font-weight="700">01</text>
      <text x="50" y="78">Inspects source, schemas, manifests &amp; CI before writing</text>

      <line x1="22" y1="96" x2="488" y2="96" stroke="#23272e"/>
      <text x="22" y="126" fill="#c84b31" font-weight="700">02</text>
      <text x="50" y="126">Authors Mermaid architecture, ER models, ADRs &amp; AGENTS.md</text>

      <line x1="22" y1="144" x2="488" y2="144" stroke="#23272e"/>
      <text x="22" y="174" fill="#c84b31" font-weight="700">03</text>
      <text x="50" y="174">Enforces Mode A-E scope boundaries &amp; zero-dep validation</text>

      <line x1="22" y1="192" x2="488" y2="192" stroke="#23272e"/>
      <text x="22" y="222" fill="#c84b31" font-weight="700">04</text>
      <text x="50" y="222">Preserves attribution, licensing &amp; owner decision gates</text>
    </g>

    <rect x="22" y="242" width="466" height="26" rx="4" fill="#1f2937"/>
    <text x="34" y="259" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="11">OUTCOME: Maintainable repository ready for real engineers</text>
  </g>
</svg>
