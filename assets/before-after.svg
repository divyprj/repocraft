<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" role="img" aria-label="Before and After RepoCraft Comparison">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goodAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b"/>
    </pattern>
  </defs>

  <rect width="1120" height="390" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="1120" height="390" rx="16" fill="url(#grid)" opacity="0.5"/>

  <text x="32" y="40" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="0.06em">WHY REPOCRAFT</text>
  <text x="190" y="40" fill="#64748b" font-family="ui-monospace, monospace" font-size="12">STOP SHIPPING AI-GENERATED DOCUMENTATION SLOP</text>

  <!-- Left Card: Without RepoCraft -->
  <g transform="translate(32, 62)">
    <rect width="514" height="296" rx="12" fill="#111622" stroke="#7f1d1d" stroke-opacity="0.7" stroke-width="1.4"/>
    <rect width="514" height="4" rx="2" fill="#ef4444"/>
    <text x="20" y="34" fill="#f87171" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">WITHOUT REPOCRAFT (RAW AI AGENT)</text>

    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#cbd5e1">
      <rect x="20" y="52" width="474" height="42" rx="8" fill="#1c1218" stroke="#451a20"/>
      <text x="34" y="77" fill="#fca5a5">✕  Hallucinates API endpoints, env vars, and CLI flags</text>

      <rect x="20" y="104" width="474" height="42" rx="8" fill="#1c1218" stroke="#451a20"/>
      <text x="34" y="129" fill="#fca5a5">✕  Writes buzzword fluff ("cutting-edge revolutionary solution")</text>

      <rect x="20" y="156" width="474" height="42" rx="8" fill="#1c1218" stroke="#451a20"/>
      <text x="34" y="181" fill="#fca5a5">✕  Spawns 15 empty placeholder docs and broken relative links</text>

      <rect x="20" y="208" width="474" height="42" rx="8" fill="#1c1218" stroke="#451a20"/>
      <text x="34" y="233" fill="#fca5a5">✕  Invents licenses, fake contributor credits, or modifies app code</text>
    </g>
    <text x="20" y="278" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">Result: Maintainers spend hours undoing inaccurate PRs</text>
  </g>

  <!-- Right Card: With RepoCraft -->
  <g transform="translate(574, 62)">
    <rect width="514" height="296" rx="12" fill="#0e1628" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="1.4"/>
    <rect width="514" height="4" rx="2" fill="url(#goodAccent)"/>
    <text x="20" y="34" fill="#22d3ee" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">WITH REPOCRAFT SKILL (CODE-VERIFIED)</text>

    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
      <rect x="20" y="52" width="474" height="42" rx="8" fill="#0b1f2a" stroke="#164e63"/>
      <text x="34" y="77" fill="#a5f3fc">✔  Inspects source, schemas, manifests &amp; CI before writing</text>

      <rect x="20" y="104" width="474" height="42" rx="8" fill="#0b1f2a" stroke="#164e63"/>
      <text x="34" y="129" fill="#a5f3fc">✔  Produces Mermaid architecture, ER diagrams, ADRs &amp; AGENTS.md</text>

      <rect x="20" y="156" width="474" height="42" rx="8" fill="#0b1f2a" stroke="#164e63"/>
      <text x="34" y="181" fill="#a5f3fc">✔  Enforces strict Mode A-E boundaries &amp; zero-dep validation</text>

      <rect x="20" y="208" width="474" height="42" rx="8" fill="#0b1f2a" stroke="#164e63"/>
      <text x="34" y="233" fill="#a5f3fc">✔  Protects attribution, licensing &amp; owner approval boundaries</text>
    </g>
    <text x="20" y="278" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">Result: Senior-engineer repository ready for contributors</text>
  </g>
</svg>
