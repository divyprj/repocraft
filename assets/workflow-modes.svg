<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 336" width="1120" height="336" role="img" aria-label="RepoCraft 5 Execution Modes and Engineering Pipeline">
  <defs>
    <pattern id="draftGrid2" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e4ded2" stroke-width="0.8"/>
    </pattern>
    <marker id="inkArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#c84b31"/>
    </marker>
  </defs>

  <rect width="1120" height="336" rx="12" fill="#f5f2eb" stroke="#d4cec0" stroke-width="1.5"/>
  <rect width="1120" height="336" rx="12" fill="url(#draftGrid2)" opacity="0.65"/>

  <!-- Header -->
  <text x="36" y="40" fill="#141619" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" letter-spacing="0.1em">02 / EXECUTION MODES</text>
  <text x="1084" y="40" text-anchor="end" fill="#6b655a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">CLAUDE · CURSOR · CODEX · ANTIGRAVITY · OPENCODE</text>
  <line x1="36" y1="54" x2="1084" y2="54" stroke="#141619" stroke-width="1.2"/>

  <!-- 5 Editorial Mode Cards -->
  <g transform="translate(36, 72)">
    <rect width="196" height="126" rx="6" fill="#fbf9f4" stroke="#c9c2b2" stroke-width="1.2"/>
    <rect width="196" height="4" rx="2" fill="#2c4a6e"/>
    <text x="16" y="30" fill="#2c4a6e" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MODE A</text>
    <text x="16" y="52" fill="#141619" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">New Repository</text>
    <text x="16" y="76" fill="#524e46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">Scaffold structure,</text>
    <text x="16" y="94" fill="#524e46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">README, governance</text>
    <text x="16" y="112" fill="#524e46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">and AGENTS.md</text>
  </g>

  <g transform="translate(248, 72)">
    <rect width="196" height="126" rx="6" fill="#fbf9f4" stroke="#c9c2b2" stroke-width="1.2"/>
    <rect width="196" height="4" rx="2" fill="#2c4a6e"/>
    <text x="16" y="30" fill="#2c4a6e" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MODE B</text>
    <text x="16" y="52" fill="#141619" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Existing Repo</text>
    <text x="16" y="76" fill="#524e46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">Inspect source code</text>
    <text x="16" y="94" fill="#524e46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">and sync diagrams,</text>
    <text x="16" y="112" fill="#524e46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">ER models &amp; ADRs</text>
  </g>

  <g transform="translate(460, 72)">
    <rect width="196" height="126" rx="6" fill="#141619" stroke="#141619" stroke-width="1.2"/>
    <rect width="196" height="4" rx="2" fill="#c84b31"/>
    <text x="16" y="30" fill="#e87a64" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MODE C</text>
    <text x="16" y="52" fill="#f5f2eb" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Docs-Only Safe</text>
    <text x="16" y="76" fill="#c9c2b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">Hard boundary: zero</text>
    <text x="16" y="94" fill="#c9c2b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">app logic, config, or</text>
    <text x="16" y="112" fill="#c9c2b2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">dependency edits</text>
  </g>

  <g transform="translate(672, 72)">
    <rect width="196" height="126" rx="6" fill="#fbf9f4" stroke="#c9c2b2" stroke-width="1.2"/>
    <rect width="196" height="4" rx="2" fill="#2c4a6e"/>
    <text x="16" y="30" fill="#2c4a6e" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MODE D</text>
    <text x="16" y="52" fill="#141619" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Maintenance</text>
    <text x="16" y="76" fill="#524e46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">Surgical updates to</text>
    <text x="16" y="94" fill="#524e46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">affected docs and</text>
    <text x="16" y="112" fill="#524e46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">CHANGELOG entries</text>
  </g>

  <g transform="translate(884, 72)">
    <rect width="200" height="126" rx="6" fill="#fbf9f4" stroke="#c9c2b2" stroke-width="1.2"/>
    <rect width="200" height="4" rx="2" fill="#c84b31"/>
    <text x="16" y="30" fill="#c84b31" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MODE E</text>
    <text x="16" y="52" fill="#141619" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Read-Only Audit</text>
    <text x="16" y="76" fill="#524e46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">Prioritized gap report</text>
    <text x="16" y="94" fill="#524e46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">covering security, IP,</text>
    <text x="16" y="112" fill="#524e46" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11.5">and missing docs</text>
  </g>

  <!-- Bottom Pipeline Strip -->
  <g transform="translate(36, 224)">
    <rect width="1048" height="82" rx="8" fill="#141619"/>
    <text x="22" y="26" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" letter-spacing="0.08em">STANDARD EXECUTION PIPELINE</text>

    <rect x="22" y="39" width="210" height="28" rx="4" fill="#1f2329" stroke="#343942"/>
    <text x="127" y="57" text-anchor="middle" fill="#f5f2eb" font-family="ui-monospace, monospace" font-size="11.5">01. Inspect Source</text>

    <line x1="238" y1="53" x2="278" y2="53" stroke="#c84b31" stroke-width="1.8" marker-end="url(#inkArrow)"/>

    <rect x="286" y="39" width="210" height="28" rx="4" fill="#1f2329" stroke="#343942"/>
    <text x="391" y="57" text-anchor="middle" fill="#f5f2eb" font-family="ui-monospace, monospace" font-size="11.5">02. Model Architecture</text>

    <line x1="502" y1="53" x2="542" y2="53" stroke="#c84b31" stroke-width="1.8" marker-end="url(#inkArrow)"/>

    <rect x="550" y="39" width="210" height="28" rx="4" fill="#1f2329" stroke="#343942"/>
    <text x="655" y="57" text-anchor="middle" fill="#f5f2eb" font-family="ui-monospace, monospace" font-size="11.5">03. Apply Governance</text>

    <line x1="766" y1="53" x2="806" y2="53" stroke="#c84b31" stroke-width="1.8" marker-end="url(#inkArrow)"/>

    <rect x="814" y="39" width="212" height="28" rx="4" fill="#c84b31"/>
    <text x="920" y="57" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">04. Validate &amp; Report</text>
  </g>
</svg>
